{# RW-V4 #}
<div class="auth-panel-inner">
    <span class="rw-chip mb-3"><i class="bi bi-stars"></i> AI-powered credit assessment</span>
    <h2 class="auth-panel-title">Welcome to <span class="rw-accent">RiskWise</span></h2>
    <p class="auth-panel-text">Know the default risk of a loan before it happens. Get a credit score, default probability and risk level in seconds.</p>

    <svg class="auth-illustration" viewBox="0 0 440 320" role="img" aria-label="Sample RiskWise report with credit score 828, low risk and default probability 12 percent">
        <circle cx="60" cy="40" r="3" fill="#14B8B0" opacity="0.6"/>
        <circle cx="400" cy="250" r="4" fill="#FBBF24" opacity="0.6"/>
        <circle cx="20" cy="260" r="5" fill="#14B8B0" opacity="0.3"/>

        <!-- Main report card -->
        <rect x="30" y="50" width="280" height="230" rx="18" fill="rgba(255,255,255,0.08)" stroke="#14B8B0" stroke-opacity="0.55"/>
        <circle cx="52" cy="72" r="4" fill="#14B8B0"/>
        <circle cx="66" cy="72" r="4" fill="#FBBF24"/>
        <circle cx="80" cy="72" r="4" fill="#EF4444"/>
        <text x="52" y="106" font-size="12" fill="#BFD6EE">Credit Score</text>

        <circle cx="105" cy="178" r="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="10"/>
        <circle cx="105" cy="178" r="44" fill="none" stroke="#14B8B0" stroke-width="10" stroke-linecap="round"
                stroke-dasharray="243.3 276.5" transform="rotate(-90 105 178)"/>
        <text x="105" y="184" text-anchor="middle" font-size="26" font-weight="600" fill="#FFFFFF">828</text>
        <text x="105" y="201" text-anchor="middle" font-size="11" fill="#BFD6EE">/ 900</text>

        <rect x="52" y="240" width="92" height="26" rx="13" fill="#10B981"/>
        <text x="98" y="257" text-anchor="middle" font-size="12" font-weight="600" fill="#FFFFFF">Low Risk</text>

        <rect x="188" y="206" width="22" height="44" rx="4" fill="#14B8B0" opacity="0.55"/>
        <rect x="218" y="182" width="22" height="68" rx="4" fill="#14B8B0" opacity="0.8"/>
        <rect x="248" y="150" width="22" height="100" rx="4" fill="#FBBF24"/>
        <path d="M190 160 L222 138 L242 148 L274 118" fill="none" stroke="#14B8B0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- Floating probability card -->
        <rect x="262" y="18" width="150" height="76" rx="14" fill="#0A2149" stroke="#14B8B0" stroke-opacity="0.7"/>
        <text x="278" y="42" font-size="11" fill="#BFD6EE">Default Probability</text>
        <text x="278" y="72" font-size="26" font-weight="600" fill="#FFFFFF">12%</text>
        <rect x="336" y="60" width="62" height="8" rx="4" fill="rgba(255,255,255,0.15)"/>
        <rect x="336" y="60" width="8" height="8" rx="4" fill="#10B981"/>

        <!-- Shield logo -->
        <g transform="translate(288 150) scale(4)">
            <path d="M16 2L28 7V16C28 23 22.5 28 16 30C9.5 28 4 23 4 16V7Z" fill="#0A2149" stroke="#14B8B0" stroke-width="1.6" stroke-linejoin="round"/>
            <rect x="9.5" y="18" width="3" height="4.5" rx="0.6" fill="#FBBF24"/>
            <rect x="14.5" y="15" width="3" height="7.5" rx="0.6" fill="#FBBF24"/>
            <rect x="19.5" y="12" width="3" height="10.5" rx="0.6" fill="#FBBF24"/>
            <path d="M9 14.5L13.5 11.5L16.5 13L22.5 8" fill="none" stroke="#14B8B0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
    </svg>

    <ul class="auth-benefits list-unstyled mb-0">
        <li><i class="bi bi-check-circle-fill"></i> Credit score from 300 to 900</li>
        <li><i class="bi bi-check-circle-fill"></i> Low, Medium and High risk category</li>
        <li><i class="bi bi-check-circle-fill"></i> Every prediction saved to your history</li>
    </ul>
</div>
