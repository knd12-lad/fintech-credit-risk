<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | RiskWise</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #F4F6F9;
            color: #0B132B;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .error-card {
            background: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(11, 19, 43, 0.08);
            max-width: 520px;
            width: 100%;
            padding: 40px 32px;
            text-align: center;
        }
        .error-icon {
            width: 72px;
            height: 72px;
            background: #FEE2E2;
            color: #DC2626;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 24px;
        }
        .error-code {
            font-size: 42px;
            font-weight: 800;
            color: #0B132B;
            line-height: 1.1;
            margin-bottom: 8px;
        }
        .error-title {
            font-size: 20px;
            font-weight: 600;
            color: #0B132B;
            margin-bottom: 12px;
        }
        .error-msg {
            color: #64748B;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-home {
            display: inline-block;
            background: #14B8A6;
            color: #FFFFFF;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            padding: 12px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.25);
            transition: background 0.2s ease;
        }
        .btn-home:hover {
            background: #0D9488;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-icon">!</div>
        <h1 class="error-code">500</h1>
        <h2 class="error-title">Unexpected Server Error</h2>
        <p class="error-msg">
            Something went wrong on our end while processing your request. Please try again in a few moments or return to the homepage.
        </p>
        <a href="/" class="btn-home">Back to Home</a>
    </div>
</body>
</html>
